name: Deterministic checks
on:
  push:
    paths: &inputs
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - '*.md'
      - '*.json'
      - 'bun.lock'
      - '*.mjs'
      - '*.mts'
      - 'styles.css'
      - 'NOTICE'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.gitignore'
      - '.github/workflows/**'
  pull_request:
    paths: *inputs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deterministic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2, immutable revision
        with:
          bun-version: '1.3.14'
      - name: Initialize public-only privacy check (not owner clearance)
        run: printf '# Private terms are local only; full owner rescan required before publication.\n' > .git/info/private-terms
      - name: Install without lifecycle execution
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Unit tests
        run: bun run test
      - name: Typecheck and build
        run: bun run build
      - name: Deterministic gates including all commit messages
        run: bun run gates
# GPU e2e is never hosted here. See gpu-e2e.yml: opt-in self-hosted homelab-gpu runner.
# One bounded job, no caches/uploads/secrets. Configure repository spending limits before enabling hosted Actions.
